    Datapoint l_pinky = 21;
    Datapoint r_wrist = 22;
    Datapoint r_thumb1 = 23;
    Datapoint r_thumb2 = 24;
    Datapoint r_thumb3 = 25;
    Datapoint r_thumb = 26;
