syntax = "proto3";
package sports_keypoints_proto;

message Double {
    double data = 1;
    string warning = 2; // optional
}

message Datapoint {
    double x = 1;
    double y = 2;
    double confidence = 3;
}

message Line {
    Datapoint first_point_on_line = 1;
    Datapoint second_point_on_line = 2;
}

message Body25PoseDatapoints {
    Datapoint nose = 1;
    Datapoint neck = 2;
    Datapoint r_shoulder = 3;
    Datapoint r_elbow = 4;
    Datapoint r_wrist = 5;
    Datapoint l_shoulder = 6;
    Datapoint l_elbow = 7;
    Datapoint l_wrist = 8;
    Datapoint midhip = 9;
    Datapoint r_hip = 10;
    Datapoint r_knee = 11;
    Datapoint r_ankle = 12;
    Datapoint l_hip = 13;
    Datapoint l_knee = 14;
    Datapoint l_ankle = 15;
    Datapoint r_eye = 16;
    Datapoint l_eye = 17;
    Datapoint r_ear = 18;
    Datapoint l_ear = 19;
    Datapoint l_big_toe = 20;
    Datapoint l_small_toe = 21;
    Datapoint l_heel = 22;
    Datapoint r_big_toe = 23;
    Datapoint r_small_toe = 24;
    Datapoint r_heel = 25;
}

message Body25HandDatapoints {
